name: Lighthouse

on:
  deployment_status:

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Vercel Deployment Protection redirects preview URLs to an SSO login
      # page. Without a bypass secret Lighthouse audits that login page and
      # reports the site as failing, which is a false negative. Skip instead of
      # publishing a meaningless score.
      - name: Check protection bypass
        id: guard
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS_SECRET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Lighthouse — VERCEL_AUTOMATION_BYPASS_SECRET is not configured, so the preview URL resolves to Vercel's SSO login rather than the site."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # The secret is written into a runtime config rather than the URL or a
      # step output, so it never lands in an artifact or a job output.
      - name: Build Lighthouse config
        if: steps.guard.outputs.enabled == 'true'
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync(".lighthouserc.json", "utf8"));
            config.ci = config.ci || {};
            config.ci.collect = config.ci.collect || {};
            config.ci.collect.settings = {
              ...config.ci.collect.settings,
              extraHeaders: JSON.stringify({
                "x-vercel-protection-bypass": process.env.BYPASS_SECRET,
              }),
            };
            fs.writeFileSync("lighthouserc.ci.json", JSON.stringify(config, null, 2));
          '

      - name: Run Lighthouse
        id: lighthouse
        if: steps.guard.outputs.enabled == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ github.event.deployment_status.target_url }}
          configPath: ./lighthouserc.ci.json
          uploadArtifacts: true

      - name: Format results
        id: format
        uses: actions/github-script@v9
        if: always() && steps.lighthouse.outcome == 'success'
        with:
          script: |
            const results = ${{ steps.lighthouse.outputs.manifest }};
            const r = results[0].summary;
            const score = (v) => Math.round(v * 100);
            const emoji = (v) => v >= 0.9 ? '🟢' : v >= 0.5 ? '🟠' : '🔴';
            const body = [
              '### Lighthouse Results',
              '',
              `> Tested: ${results[0].url}`,
              '',
              '| Category | Score |',
              '|----------|-------|',
              `| ${emoji(r.performance)} Performance | ${score(r.performance)} |`,
              `| ${emoji(r.accessibility)} Accessibility | ${score(r.accessibility)} |`,
              `| ${emoji(r['best-practices'])} Best Practices | ${score(r['best-practices'])} |`,
              `| ${emoji(r.seo)} SEO | ${score(r.seo)} |`,
            ].join('\n');
            core.setOutput('body', body);

      - name: Find PR number
        id: find-pr
        uses: actions/github-script@v9
        if: always() && steps.format.outcome == 'success'
        with:
          script: |
            const deploys = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.deployment.sha,
              per_page: 1,
            });
            if (deploys.data.length === 0) return;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${deploys.data[0].ref}`,
            });
            if (prs.data.length > 0) {
              core.setOutput('number', prs.data[0].number);
            }

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        if: always() && steps.find-pr.outputs.number
        with:
          header: lighthouse
          number: ${{ steps.find-pr.outputs.number }}
          message: ${{ steps.format.outputs.body }}
