name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      # Neither key is real, but the publishable one must still be structurally
      # valid: Clerk decodes it as base64 to derive the frontend API host, and
      # "pk_test_placeholder" fails with "Publishable key not valid". The suffix
      # below decodes to "example.clerk.accounts.dev$".
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      # proxy.ts runs clerkMiddleware on every request, which throws "Missing
      # secretKey" without this — the server then 500s for every request and the
      # Playwright webServer health check times out after 120s.
      CLERK_SECRET_KEY: sk_test_placeholder
      REVALIDATE_SECRET: ci-only-placeholder-secret-32-chars

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run doctor

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload browser-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
